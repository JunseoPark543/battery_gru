[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-weighted-maml"
version = "0.1.0"
description = "Direct target-aware weighted MAML for battery SOH forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "cvxpy>=1.4",
  "osqp>=0.6",
  "scs>=3.2",
  "higher>=0.2.1",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
battery-maml = "battery_weighted_maml.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

