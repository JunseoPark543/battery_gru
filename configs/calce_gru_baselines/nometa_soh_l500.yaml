seed: 42
device: auto

data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  history_length: 500
  max_forecast_cycle: null
  eol_threshold: 0.8

model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.0

training:
  max_epochs: 300
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  # Identical to nometa_soh_l100.yaml so history length is the only setting change.
  encoder_window: 50
  forecast_horizon: 10
  window_stride: 1
  validation_cycles: 20
  teacher_forcing_ratio: 0.5
  gradient_clip_norm: 5.0
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-7

logging:
  log_interval: 1
  checkpoint_interval: 1

