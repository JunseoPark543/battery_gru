seed: 42
device: auto

data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  eol_threshold: 0.8
  history_lengths: [100]
  # Predict from cycle 101 through the target's final observed cycle.
  max_forecast_cycle: null

model:
  input_size: 3
  features: [soh, voltage_mean, current_mean]
  voltage_normalization: support_zscore
  current_normalization: support_zscore
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  teacher_forcing_ratio: 0.5

maml:
  # Weighted second-order BOIL: adapt encoder/decoder only in the inner loop;
  # the final Linear SOH head is frozen there but learned by the outer loop.
  algorithm: boil
  full_maml: true
  inner_steps: 1
  # Disable the adaptation-path robust auxiliary objective. The outer objective
  # is the ordinary alpha-weighted source query MSE after one BOIL update.
  robust_path_steps: null
  robust_path_worst_weight: 0.0
  robust_path_dispersion_weight: 0.0
  inner_lr: 0.05
  inner_batch_size: 64
  outer_lr: 0.001
  meta_iterations: 2300
  gradient_clip_norm: 5.0

weights:
  method: mmd_qp
  kernel: rbf
  sigma: median
  qp_solver_primary: OSQP
  qp_solver_fallback: SCS
  diagonal_jitter: 1.0e-8
  recompute_every_iteration: true
  detach_alpha: true

adaptation:
  # Target BOIL adaptation follows the same body-only update rule.
  fast_steps: [1, 3, 5, 10]
  full_max_steps: 200
  full_patience: 20
  learning_rate: 0.05

logging:
  log_interval: 10
  checkpoint_interval: 100
  save_alpha_interval: 10

evaluation:
  primary_adaptation: full
  save_per_cycle_predictions: true

source_mode: same_family
