seed: 42
device: auto

data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  # Target observation length. It is also forced into the sampled source cut
  # points whenever a source cell contains at least 101 cycles.
  history_length: 100
  # Predict the target from cycle 101 through its complete available life.
  max_forecast_cycle: null
  eol_threshold: 0.8
  source_mode: same_family

model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  # Kept identical to the previous transfer baseline as requested.
  teacher_forcing_ratio: 0.5

pretraining:
  # Generalize encoder-decoder across observation lengths: every valid source
  # cycle is a possible cut c for 1..c -> c+1..source end-of-record.
  prefix_mode: variable_cutpoint
  min_cut_point: 1
  max_cut_point: null
  # null uses every possible source cut each epoch. Sixteen stratified cuts per
  # source is the practical default; their locations change each epoch and
  # cut=100 is always included.
  cut_points_per_source_per_epoch: 16
  cut_point_batch_size: 16
  include_target_history_cut_point: true
  # Stable, fully recursive source check used for best-model selection and
  # early stopping. Invalid points for a shorter source are skipped.
  selection_cut_points: [25, 50, 75, 100, 200, 500, 1000, 1500]

  max_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  early_stopping: true
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-7

fine_tuning:
  # Target cycles 1..100 only. The experiment reports zero-shot before these
  # variants, fast snapshots, and a separately initialized full fine-tune.
  learning_rate: 0.05
  batch_size: 64
  fast_steps: [1, 3, 5, 10, 15, 20]
  full_max_steps: 200
  full_patience: 20

logging:
  log_interval: 1
  checkpoint_interval: 10
