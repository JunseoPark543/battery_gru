seed: 42
device: auto

data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  history_length: 100
  # null forecasts from cycle 101 through the target cell's final cycle.
  max_forecast_cycle: null
  eol_threshold: 0.8
  # For CX2_37, every other CX2 cell is a uniformly weighted source.
  source_mode: same_family

model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  # Paper setting: 50% ground truth, 50% previous prediction during training.
  # Validation/evaluation are always fully recursive.
  teacher_forcing_ratio: 0.5

pretraining:
  # Each epoch uses every source cell once. Encoder input is cycles 1..100;
  # the decoder is supervised on cycles 101..the source cell's final cycle.
  max_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  early_stopping: true
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-7

fine_tuning:
  # Ordinary SGD on prefix-to-future pairs formed only within target cycles
  # 1..100. Target cycles 101+ never enter fine-tuning or model selection.
  learning_rate: 0.05
  batch_size: 64
  fast_steps: [1, 3, 5, 10, 15, 20]
  full_max_steps: 200
  full_patience: 20

logging:
  log_interval: 1
  checkpoint_interval: 10
