seed: 42
device: auto

paths:
  data_root: data/MATR
  output_root: outputs/partial_vq_forecasting

data:
  dataset: MATR
  file_globs:
    - "**/*.pkl"
  minimum_valid_cycles: 30
  minimum_discharge_points: 16
  short_signal_threshold: 32
  reference_cycles: [5, 6, 7, 8, 9, 10]
  minimum_reference_cycles: 3

# q is discharged capacity / nominal capacity. The maximum must be above the
# largest q_end in MATR, because q_end is unknown at inference time.
q_grid:
  minimum: 0.0
  maximum: 1.2
  num_points: 256

# Cells, not cycles, are split. No cycle from a held-out cell enters training.
split:
  strategy: kfold
  num_folds: 5
  validation_fraction: 0.2
  seed: 42

episode:
  minimum_cycle_position: 10
  training_beta_range: [0.1, 0.8]
  evaluation_betas: [0.2, 0.4, 0.6, 0.8]
  evaluation_cycle_alphas: [0.2, 0.5, 0.8]
  minimum_observed_points: 8
  minimum_future_points: 8

model:
  convolution_channels: [32, 64, 64]
  kernel_size: 5
  hidden_dim: 64
  attention_layers: 2
  attention_heads: 4
  feedforward_dim: 128
  decoder_hidden_dim: 128
  dropout: 0.1
  use_attention: true

training:
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_steps: 20000
  batch_size: 16
  voltage_huber_delta: 0.5
  endpoint_huber_delta: 0.05
  endpoint_weight: 1.0
  observed_reconstruction_weight: 0.1
  monotonic_weight: 0.0
  gradient_clip_norm: 1.0
  validation_interval: 500
  checkpoint_interval: 500
  log_interval: 10
  early_stopping_patience: 12
  use_amp: true
  deterministic: true

evaluation:
  plot_cells: 6
  dpi: 180
