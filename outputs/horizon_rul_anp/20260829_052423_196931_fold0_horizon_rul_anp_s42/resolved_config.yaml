seed: 42
device: cuda
paths:
  data_root: data/MATR
  output_root: outputs/horizon_rul_anp
data:
  dataset: MATR
  file_globs:
  - '**/*.pkl'
  minimum_valid_cycles: 30
  minimum_discharge_points: 16
  short_signal_threshold: 32
  reference_cycles:
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  minimum_reference_cycles: 3
  lifetime_source: label_file
  label_path: data/Life labels/MATR_labels.json
split:
  strategy: kfold
  num_folds: 5
  validation_fraction: 0.2
  seed: 42
task:
  min_horizon: 20
  max_horizon: 500
  context_size_min: 8
  context_size_max: 16
  query_size: 8
  min_cells_per_task: 16
  max_resample_attempts: 100
model:
  prefix_feature_dim: 3
  d_model: 128
  attention_heads: 4
  prefix_layers: 2
  dropout: 0.1
  latent_dim: 64
  mlp_layers: 3
  minimum_std: 0.001
training:
  learning_rate: 0.0001
  max_steps: 20000
  task_batch_size: 1
  gradient_clip_norm: 1.0
  beta_kl: 1.0
  kl_warmup_steps: 5000
  validation_interval: 500
  validation_horizons:
  - 20
  - 40
  - 60
  - 80
  - 100
  early_stopping_patience: 10
  checkpoint_interval: 500
  log_interval: 10
  use_amp: true
  deterministic: true
evaluation:
  horizons:
  - 20
  - 40
  - 60
  - 80
  - 100
  context_size: 16
  mc_samples: 50
  interval_level: 0.95
  mape_epsilon_cycles: 1.0
  plot_cell: null
