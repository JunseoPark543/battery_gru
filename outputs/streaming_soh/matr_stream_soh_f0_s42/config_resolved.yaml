seed: 42
device: cuda
paths:
  data_root: data/MATR
  output_root: outputs/streaming_soh
data:
  dataset: MATR
  file_globs:
  - '**/*.pkl'
  minimum_valid_cycles: 30
  minimum_discharge_points: 16
  short_signal_threshold: 32
  reference_cycles:
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  minimum_reference_cycles: 3
q_grid:
  minimum: 0.0
  maximum: 1.2
  num_points: 128
split:
  strategy: kfold
  num_folds: 5
  validation_fraction: 0.2
  seed: 42
episode:
  minimum_current_cycle: 100
  minimum_history_cycles: 20
  maximum_history_cycles: 256
  minimum_future_cycles: 20
  maximum_training_future_points: 256
  training_cycle_alpha_range:
  - 0.2
  - 0.8
  training_beta_range:
  - 0.1
  - 0.9
  evaluation_cycle_alphas:
  - 0.3
  - 0.5
  - 0.7
  evaluation_betas:
  - 0.25
  - 0.5
  - 0.75
  minimum_observed_q_points: 8
  minimum_future_q_points: 8
  cycle_scale: 1000.0
model:
  convolution_channels:
  - 32
  - 64
  - 64
  kernel_size: 5
  curve_embedding_dim: 64
  cycle_feature_dim: 96
  gru_hidden_dim: 128
  gru_layers: 2
  decoder_hidden_dim: 128
  dropout: 0.1
  minimum_soh_std: 0.003
training:
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_steps: 20000
  batch_size: 8
  soh_huber_delta: 0.02
  voltage_huber_delta: 0.5
  endpoint_huber_delta: 0.05
  uncertainty_weight: 0.05
  voltage_completion_weight: 0.2
  endpoint_weight: 0.1
  monotonic_weight: 0.01
  gradient_clip_norm: 1.0
  validation_interval: 500
  checkpoint_interval: 500
  log_interval: 10
  early_stopping_patience: 12
  deterministic: true
evaluation:
  plot_cells: 6
  interval_level: 0.95
  dpi: 180
