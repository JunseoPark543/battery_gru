seed: 42
device: auto
data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  eol_threshold: 0.8
  history_lengths:
  - 50
  - 100
  - 150
  max_forecast_cycle: 1000
model:
  input_size: 1
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  teacher_forcing_ratio: 0.5
maml:
  full_maml: true
  inner_steps: 1
  inner_lr: 0.05
  inner_batch_size: 64
  outer_lr: 0.001
  meta_iterations: 10000
  gradient_clip_norm: 5.0
weights:
  method: mmd_qp
  kernel: rbf
  sigma: median
  qp_solver_primary: OSQP
  qp_solver_fallback: SCS
  diagonal_jitter: 1.0e-08
  recompute_every_iteration: true
  detach_alpha: true
adaptation:
  fast_steps: 1
  full_max_steps: 200
  full_patience: 20
  learning_rate: 0.05
logging:
  log_interval: 10
  checkpoint_interval: 100
  save_alpha_interval: 10
evaluation:
  primary_adaptation: full
  save_per_cycle_predictions: true
source_mode: same_family
