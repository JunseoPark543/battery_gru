seed: 42
device: cuda
data:
  calce_dir: data/CALCE
  label_path: data/Life labels/CALCE_labels.json
  history_length: 100
  max_forecast_cycle: null
  eol_threshold: 0.8
  source_mode: same_family
model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  teacher_forcing_ratio: 0.5
pretraining:
  max_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  early_stopping: true
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-07
  prefix_mode: variable_cutpoint
  min_cut_point: 1
  max_cut_point: null
  cut_points_per_source_per_epoch: 16
  cut_point_batch_size: 16
  include_target_history_cut_point: true
  selection_cut_points:
  - 25
  - 50
  - 75
  - 100
  - 200
  - 500
  - 1000
  - 1500
fine_tuning:
  learning_rate: 0.05
  batch_size: 64
  fast_steps:
  - 1
  - 3
  - 5
  - 10
  - 15
  - 20
  full_max_steps: 200
  full_patience: 20
logging:
  log_interval: 1
  checkpoint_interval: 10
