seed: 42
device: cuda
paths:
  data_root: data/MATR
  output_root: outputs/horizon_lifetime_iv_anp
data:
  dataset: MATR
  file_globs:
  - '**/*.pkl'
  minimum_valid_cycles: 30
  minimum_discharge_points: 16
  short_signal_threshold: 32
  reference_cycles:
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  minimum_reference_cycles: 3
  lifetime_source: label_file
  label_path: data/Life labels/MATR_labels.json
q_grid:
  minimum: 0.0
  maximum: 1.2
  num_points: 256
split:
  strategy: kfold
  num_folds: 5
  validation_fraction: 0.2
  seed: 42
task:
  horizons:
  - 60
  - 80
  - 100
  - 120
  - 140
  - 160
  - 180
  - 200
  - 220
  - 240
  - 260
  - 280
  - 300
  - 320
  - 340
  - 360
  - 380
  - 400
  - 420
  - 440
  - 460
  - 480
  - 500
  - 520
  - 540
  - 560
  - 580
  - 600
  context_size_min: 8
  context_size_max: 16
  query_size: 8
  min_cells_per_task: 16
  max_resample_attempts: 100
model:
  curve_input_dim: 3
  curve_d_model: 48
  curve_attention_heads: 4
  curve_layers: 2
  curve_patch_size: 8
  temporal_d_model: 128
  temporal_attention_heads: 4
  temporal_layers: 2
  dropout: 0.1
  latent_dim: 64
  anp_mlp_layers: 3
  minimum_std: 0.001
  gradient_checkpoint_curves: true
training:
  learning_rate: 5.0e-05
  max_steps: 20000
  task_batch_size: 1
  gradient_clip_norm: 1.0
  beta_kl: 1.0
  kl_warmup_steps: 5000
  validation_interval: 500
  early_stopping_patience: 10
  checkpoint_interval: 500
  log_interval: 10
  use_amp: true
  deterministic: true
  paired_horizon_training: false
  consistency_weight: 0.0
  consistency_horizon_gap: 20
  consistency_warmup_steps: 1000
  consistency_huber_beta: 0.25
evaluation:
