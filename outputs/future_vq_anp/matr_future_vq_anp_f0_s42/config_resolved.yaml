seed: 42
device: cuda
paths:
  data_root: data/MATR
  output_root: outputs/future_vq_anp
data:
  dataset: MATR
  file_globs:
  - '**/*.pkl'
  minimum_valid_cycles: 120
  minimum_discharge_points: 16
  short_signal_threshold: 32
  reference_cycles:
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  minimum_reference_cycles: 3
q_grid:
  minimum: 0.0
  maximum: 1.2
  num_points: 128
split:
  strategy: kfold
  num_folds: 5
  validation_fraction: 0.2
  seed: 42
episode:
  history_cycles: 100
  minimum_future_cycles: 20
  maximum_training_future_cycles: 64
  training_cut_alpha_range:
  - 0.2
  - 0.8
  evaluation_cut_cycles:
  - 100
  - 130
  - 200
  minimum_q_points: 12
  cycle_scale: 1000.0
model:
  convolution_channels:
  - 32
  - 64
  - 64
  kernel_size: 5
  curve_embedding_dim: 64
  cycle_feature_dim: 96
  gru_hidden_dim: 128
  gru_layers: 2
  attention_heads: 4
  q_embedding_dim: 32
  latent_dim: 32
  latent_hidden_dim: 128
  decoder_hidden_dim: 128
  dropout: 0.1
  minimum_latent_std: 0.02
  minimum_voltage_std: 0.003
  minimum_endpoint_std: 0.002
training:
  learning_rate: 0.0002
  weight_decay: 0.0001
  max_steps: 25000
  batch_size: 4
  voltage_huber_delta: 0.5
  voltage_huber_weight: 0.2
  endpoint_huber_delta: 0.03
  endpoint_weight: 0.5
  kl_weight: 0.01
  kl_warmup_steps: 5000
  kl_free_bits: 0.02
  q_monotonic_weight: 0.01
  endpoint_monotonic_weight: 0.01
  temporal_smoothness_weight: 0.001
  gradient_clip_norm: 1.0
  validation_interval: 500
  validation_latent_samples: 10
  checkpoint_interval: 500
  log_interval: 10
  early_stopping_patience: 12
  selection_metric: crps
  deterministic: true
evaluation:
  latent_samples: 50
  query_chunk_size: 16
  plot_cells: 4
  interval_level: 0.95
  dpi: 180
