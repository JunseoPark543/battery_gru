seed: 42
device: auto

paths:
  calce_dir: data/CALCE
  output_dir: outputs/paper_reproduction

data:
  history_length: 500
  train_cells:
    - CALCE_CX2_16.pkl
    - CALCE_CX2_33.pkl
    - CALCE_CX2_34.pkl
    - CALCE_CX2_35.pkl
    - CALCE_CX2_36.pkl
  test_cells:
    - CALCE_CX2_37.pkl
    - CALCE_CX2_38.pkl

model:
  input_size: 1
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  predicted_input_probability: 0.5
  weight_initialization: pytorch_default

loss:
  kind: mse

maml:
  max_epochs: 500
  meta_batch_size: 5
  inner_learning_rate: 0.05
  inner_steps: 1
  inner_batch_size: 64
  outer_learning_rate: 0.001
  query_batch_size: 1
  gradient_clip_norm: 5.0
  early_stopping: true
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-7
  log_interval: 1
  checkpoint_interval: 1
  optuna_trials: 0
  optuna_lr_low: 1.0e-5
  optuna_lr_high: 1.0e-2

adaptation:
  learning_rate: 0.05
  batch_size: 64
  fast_steps: [0, 1, 3, 5]
  complete_max_steps: 200
  complete_patience: 20
  complete_min_delta: 1.0e-7

evaluation:
  eol_threshold: 0.70
  forecast_mode: paper
  max_prediction_length: null
  # Backward-compatible deployment boundary; ignored in paper mode.
  max_forecast_cycle: 2000
