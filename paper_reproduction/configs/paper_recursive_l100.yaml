seed: 42
device: auto

paths:
  calce_dir: data/CALCE
  output_dir: outputs/paper_recursive_reproduction

data:
  history_length: 100
  train_cells:
    - CALCE_CX2_16.pkl
    - CALCE_CX2_33.pkl
    - CALCE_CX2_34.pkl
    - CALCE_CX2_35.pkl
    - CALCE_CX2_36.pkl
  test_cells:
    - CALCE_CX2_37.pkl
    - CALCE_CX2_38.pkl

model:
  input_size: 1
  hidden_size: 64
  num_layers: 1
  dropout: 0.0
  predicted_input_probability: 0.5
  weight_initialization: pytorch_default

loss:
  # The paper writes a generic loss L; this reproduction uses masked MSE.
  kind: mse
  # Equation (9) averages the loss of each recursive pair equally.
  recursive_reduction: sample_balanced

maml:
  max_epochs: 500
  meta_batch_size: 5
  inner_learning_rate: 0.05
  inner_steps: 1
  inner_steps_candidates: [1, 3, 5]
  multi_step_query_weights:
    1: 1.0
  experiment_label: paper-recursive-L100
  inner_batch_size: 64
  # Replaced by the TPE-selected value when the suite is run without
  # --outer-learning-rate. The paper does not publish its final value.
  outer_learning_rate: 0.001
  query_batch_size: 1
  # Gradient clipping is not reported in the paper.
  gradient_clip_norm: null
  early_stopping: true
  # Patience/min-delta are not reported; these are disclosed reproduction choices.
  early_stopping_patience: 30
  early_stopping_min_delta: 1.0e-7
  log_interval: 1
  checkpoint_interval: 1
  # The suite CLI supplies the number of TPE trials. The paper omits that number.
  optuna_trials: 0
  optuna_lr_low: 1.0e-5
  optuna_lr_high: 1.0e-2

adaptation:
  fast_learning_rate: 0.05
  complete_learning_rate: 0.05
  complete_learning_rate_candidates: [0.05]
  batch_size: 64
  fast_steps: [0, 1, 3, 5]
  complete_max_steps: 500
  # The paper says "until convergence" and max 500 but omits patience/min-delta.
  complete_patience: 30
  complete_min_delta: 1.0e-6
  recursive_loss_reduction: sample_balanced
  fast_sampling_mode: random
  sampling_mode: random
  length_stratified_bins: 5
  # Matches the paper's explicitly acknowledged optimistic test-task selection.
  # Query labels choose a checkpoint but never enter the SGD gradient.
  checkpoint_selection: paper_query_early_stopping
  validation_ratio: 0.2
  minimum_validation_length: 20
  maximum_validation_length: 100
  scheduler: constant
  scheduler_step_size: 50
  scheduler_gamma: 0.5
  scheduler_patience: 10
  gradient_clip_norm: null
  gradient_clip_candidates: [null]
  relative_update_warning_threshold: 0.5
  diagnostics: true
  oracle_diagnostics: true

evaluation:
  eol_threshold: 0.70
  # Predict every held-out cycle after L, not a fixed 1000-cycle boundary.
  forecast_mode: paper
  max_prediction_length: null
  max_forecast_cycle: 2000
